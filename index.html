<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ONDA — Monitor de señal de audio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --chassis: #1b1c1f;
    --chassis-light: #232529;
    --panel: #141518;
    --screen-bg: #0c1210;
    --grid-line: rgba(255,255,255,0.06);
    --text-main: #e9e8e3;
    --text-dim: #8b8d92;
    --amber: #ffb454;
    --led-off: #3a2a20;
    --wave-color: #6bff9e;
    --glow: 14;
    --line-width: 2.4;
    --radius: 14px;
    --screw: #0a0a0b;
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0; padding:0; height:100%;
    background: radial-gradient(circle at 50% -10%, #26282c 0%, #0e0f11 60%, #08090a 100%);
    color: var(--text-main);
    font-family: 'JetBrains Mono', monospace;
    -webkit-font-smoothing: antialiased;
  }

  .wrap{
    min-height:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 32px 16px 60px;
  }

  .device{
    width:100%;
    max-width: 920px;
    background: linear-gradient(180deg, var(--chassis-light), var(--chassis));
    border-radius: 22px;
    padding: 22px;
    box-shadow:
      0 30px 60px -20px rgba(0,0,0,0.7),
      inset 0 1px 0 rgba(255,255,255,0.05),
      inset 0 -1px 0 rgba(0,0,0,0.4);
    position: relative;
  }

  .screw{
    position:absolute;
    width:9px; height:9px;
    border-radius:50%;
    background: radial-gradient(circle at 35% 35%, #55575c, var(--screw) 70%);
    box-shadow: 0 1px 1px rgba(255,255,255,0.15), inset 0 0 1px rgba(0,0,0,0.8);
  }
  .screw.tl{ top:14px; left:14px; }
  .screw.tr{ top:14px; right:14px; }
  .screw.bl{ bottom:14px; left:14px; }
  .screw.br{ bottom:14px; right:14px; }

  .plate{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    padding: 4px 10px 18px;
  }
  .plate h1{
    font-family: 'Space Grotesk', sans-serif;
    font-weight:700;
    font-size: 22px;
    letter-spacing: 0.14em;
    margin:0;
    color: var(--text-main);
  }
  .plate .tagline{
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    text-transform: uppercase;
  }

  .status-row{
    display:flex;
    align-items:center;
    gap:8px;
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    text-transform: uppercase;
  }
  .led{
    width:9px; height:9px; border-radius:50%;
    background: var(--led-off);
    box-shadow: inset 0 0 2px rgba(0,0,0,0.6);
    transition: background 120ms ease, box-shadow 120ms ease;
  }
  .led.live{
    background: #57ffa0;
    box-shadow: 0 0 6px 2px rgba(87,255,160,0.7);
  }
  .led.error{
    background: #ff6b6b;
    box-shadow: 0 0 6px 2px rgba(255,107,107,0.6);
  }

  .screen-frame{
    background: var(--panel);
    border-radius: var(--radius);
    padding: 12px;
    box-shadow: inset 0 2px 10px rgba(0,0,0,0.6);
  }

  .screen{
    position: relative;
    width:100%;
    aspect-ratio: 16/8;
    background: var(--screen-bg);
    border-radius: 8px;
    overflow:hidden;
    box-shadow: inset 0 0 40px rgba(0,0,0,0.65), inset 0 0 0 1px rgba(255,255,255,0.03);
  }

  canvas{
    display:block;
    width:100%;
    height:100%;
  }

  .scanlines{
    position:absolute; inset:0;
    background: repeating-linear-gradient(
      to bottom,
      rgba(255,255,255,0.025) 0px,
      rgba(255,255,255,0.025) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events:none;
    mix-blend-mode: overlay;
  }

  .vignette{
    position:absolute; inset:0;
    box-shadow: inset 0 0 60px 10px rgba(0,0,0,0.55);
    pointer-events:none;
  }

  .idle-overlay{
    position:absolute; inset:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap: 14px;
    text-align:center;
    background: rgba(12,18,16,0.55);
    backdrop-filter: blur(1px);
    transition: opacity 220ms ease;
  }
  .idle-overlay.hidden{
    opacity:0;
    pointer-events:none;
  }
  .idle-overlay p{
    margin:0;
    font-size:11px;
    color: var(--text-dim);
    letter-spacing: 0.05em;
    max-width: 260px;
  }

  .mic-btn{
    width:64px; height:64px;
    border-radius:50%;
    border: none;
    cursor:pointer;
    background: radial-gradient(circle at 35% 30%, #2a2c30, #17181b 70%);
    box-shadow:
      0 4px 10px rgba(0,0,0,0.5),
      0 0 0 1px rgba(255,255,255,0.06),
      inset 0 1px 1px rgba(255,255,255,0.08);
    display:flex; align-items:center; justify-content:center;
    transition: transform 100ms ease, box-shadow 200ms ease;
    color: var(--amber);
  }
  .mic-btn:hover{ transform: translateY(-1px); }
  .mic-btn:active{ transform: translateY(1px); }
  .mic-btn.active{
    background: radial-gradient(circle at 35% 30%, #3a3226, #211c14 70%);
    box-shadow:
      0 0 0 1px rgba(255,180,84,0.5),
      0 0 18px 2px rgba(255,180,84,0.35),
      inset 0 1px 1px rgba(255,255,255,0.1);
  }
  .mic-btn svg{ width:26px; height:26px; }

  .transport{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 16px;
    padding: 18px 4px 4px;
  }

  .transport-label{
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color: var(--text-dim);
  }

  .rack{
    margin-top: 18px;
    background: var(--panel);
    border-radius: var(--radius);
    padding: 18px 18px 8px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.03);
  }

  .rack-title{
    font-size:10px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color: var(--text-dim);
    margin: 0 0 14px;
  }

  .controls-grid{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(150px,1fr));
    gap: 20px 24px;
    padding-bottom: 16px;
  }

  .control{
    display:flex;
    flex-direction:column;
    gap:8px;
  }
  .control label{
    font-size: 10.5px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color: var(--text-dim);
    display:flex;
    justify-content:space-between;
  }
  .control label span.val{ color: var(--text-main); }

  input[type="color"]{
    -webkit-appearance:none;
    appearance:none;
    width:100%;
    height: 34px;
    border:none;
    border-radius: 8px;
    padding: 0;
    background: none;
    cursor:pointer;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.08), inset 0 0 0 3px var(--panel);
  }
  input[type="color"]::-webkit-color-swatch-wrapper{ padding:0; border-radius:8px; }
  input[type="color"]::-webkit-color-swatch{ border:none; border-radius:8px; }

  input[type="range"]{
    -webkit-appearance:none;
    appearance:none;
    width:100%;
    height:4px;
    border-radius: 4px;
    background: #2c2e32;
    outline:none;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:14px; height:14px;
    border-radius:50%;
    background: var(--amber);
    box-shadow: 0 0 6px rgba(255,180,84,0.6);
    cursor:pointer;
    margin-top:-5px;
  }
  input[type="range"]::-webkit-slider-runnable-track{
    height:4px;
    border-radius:4px;
    background: #2c2e32;
  }

  .presets{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    padding-bottom: 18px;
  }
  .preset-chip{
    width:26px; height:26px;
    border-radius:50%;
    border: 2px solid rgba(255,255,255,0.12);
    cursor:pointer;
    padding:0;
    transition: transform 100ms ease, border-color 150ms ease;
  }
  .preset-chip:hover{ transform: scale(1.12); }
  .preset-chip.selected{ border-color: var(--amber); }

  .footnote{
    text-align:center;
    font-size: 10.5px;
    color: var(--text-dim);
    letter-spacing: 0.03em;
    padding: 16px 10px 2px;
    line-height:1.6;
  }
  .footnote strong{ color: var(--text-main); font-weight:500; }

  @media (max-width: 520px){
    .plate{ flex-direction:column; align-items:flex-start; gap:6px; }
    .device{ padding:16px; }
  }

  @media (prefers-reduced-motion: reduce){
    .mic-btn, .idle-overlay, .preset-chip{ transition:none; }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="device">
    <span class="screw tl"></span>
    <span class="screw tr"></span>
    <span class="screw bl"></span>
    <span class="screw br"></span>

    <div class="plate">
      <div>
        <h1>ONDA</h1>
        <div class="tagline">Monitor de señal de audio</div>
      </div>
      <div class="status-row">
        <span class="led" id="led"></span>
        <span id="statusText">Inactivo</span>
      </div>
    </div>

    <div class="screen-frame">
      <div class="screen">
        <canvas id="wave"></canvas>
        <div class="scanlines"></div>
        <div class="vignette"></div>
        <div class="idle-overlay" id="idleOverlay">
          <p id="idleText">Activa el micrófono para ver tu voz convertida en onda, en tiempo real.</p>
        </div>
      </div>
    </div>

    <div class="transport">
      <button class="mic-btn" id="micBtn" aria-label="Activar micrófono">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
          <line x1="12" y1="19" x2="12" y2="23"></line>
          <line x1="8" y1="23" x2="16" y2="23"></line>
        </svg>
      </button>
    </div>

    <div class="rack">
      <p class="rack-title">Panel de color</p>
      <div class="controls-grid">
        <div class="control">
          <label>Color de la onda <span class="val" id="waveVal">#6BFF9E</span></label>
          <input type="color" id="waveColor" value="#6bff9e">
        </div>
        <div class="control">
          <label>Fondo de pantalla <span class="val" id="bgVal">#0C1210</span></label>
          <input type="color" id="bgColor" value="#0c1210">
        </div>
        <div class="control">
          <label>Brillo / resplandor <span class="val" id="glowVal">14</span></label>
          <input type="range" id="glow" min="0" max="30" value="14">
        </div>
        <div class="control">
          <label>Grosor de línea <span class="val" id="widthVal">2.4</span></label>
          <input type="range" id="lineWidth" min="1" max="6" step="0.2" value="2.4">
        </div>
      </div>

      <p class="rack-title">Paletas rápidas</p>
      <div class="presets" id="presets"></div>
    </div>

    <p class="footnote">
      El audio se procesa <strong>únicamente en tu navegador</strong>: nunca se graba, se sube ni se guarda en ningún servidor.
    </p>
  </div>
</div>

<script>
(function(){
  const canvas = document.getElementById('wave');
  const ctx = canvas.getContext('2d');
  const screenEl = canvas.closest('.screen');
  const micBtn = document.getElementById('micBtn');
  const led = document.getElementById('led');
  const statusText = document.getElementById('statusText');
  const idleOverlay = document.getElementById('idleOverlay');
  const idleText = document.getElementById('idleText');

  const waveColorInput = document.getElementById('waveColor');
  const bgColorInput = document.getElementById('bgColor');
  const glowInput = document.getElementById('glow');
  const lineWidthInput = document.getElementById('lineWidth');
  const waveVal = document.getElementById('waveVal');
  const bgVal = document.getElementById('bgVal');
  const glowVal = document.getElementById('glowVal');
  const widthVal = document.getElementById('widthVal');
  const presetsWrap = document.getElementById('presets');

  const state = {
    waveColor: '#6bff9e',
    bgColor: '#0c1210',
    glow: 14,
    lineWidth: 2.4,
    listening: false
  };

  const presets = [
    { name: 'Fósforo', wave: '#6bff9e', bg: '#0c1210' },
    { name: 'Ámbar CRT', wave: '#ffb454', bg: '#1a1006' },
    { name: 'Cian digital', wave: '#5be0ff', bg: '#071216' },
    { name: 'Neón magenta', wave: '#ff5bd0', bg: '#150210' },
    { name: 'Blanco láser', wave: '#f3f3f0', bg: '#0a0a0a' },
    { name: 'Rojo alerta', wave: '#ff5c4d', bg: '#160404' },
  ];

  function renderPresets(){
    presetsWrap.innerHTML = '';
    presets.forEach(p => {
      const btn = document.createElement('button');
      btn.className = 'preset-chip';
      btn.style.background = p.wave;
      btn.title = p.name;
      btn.setAttribute('aria-label', 'Paleta ' + p.name);
      btn.addEventListener('click', () => {
        state.waveColor = p.wave;
        state.bgColor = p.bg;
        waveColorInput.value = p.wave;
        bgColorInput.value = p.bg;
        updateLabels();
        markSelectedPreset(btn);
      });
      presetsWrap.appendChild(btn);
    });
  }
  function markSelectedPreset(activeBtn){
    document.querySelectorAll('.preset-chip').forEach(c => c.classList.remove('selected'));
    if(activeBtn) activeBtn.classList.add('selected');
  }
  renderPresets();

  function updateLabels(){
    waveVal.textContent = state.waveColor.toUpperCase();
    bgVal.textContent = state.bgColor.toUpperCase();
    glowVal.textContent = state.glow;
    widthVal.textContent = state.lineWidth.toFixed(1);
  }
  updateLabels();

  waveColorInput.addEventListener('input', e => { state.waveColor = e.target.value; updateLabels(); markSelectedPreset(null); });
  bgColorInput.addEventListener('input', e => { state.bgColor = e.target.value; updateLabels(); markSelectedPreset(null); });
  glowInput.addEventListener('input', e => { state.glow = Number(e.target.value); updateLabels(); });
  lineWidthInput.addEventListener('input', e => { state.lineWidth = Number(e.target.value); updateLabels(); });

  function resizeCanvas(){
    const rect = screenEl.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  function drawGrid(w, h){
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 1;
    const cols = 12, rows = 6;
    ctx.beginPath();
    for(let i=1;i<cols;i++){
      const x = (w/cols)*i;
      ctx.moveTo(x,0); ctx.lineTo(x,h);
    }
    for(let j=1;j<rows;j++){
      const y = (h/rows)*j;
      ctx.moveTo(0,y); ctx.lineTo(w,y);
    }
    ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.09)';
    ctx.beginPath();
    ctx.moveTo(0, h/2); ctx.lineTo(w, h/2);
    ctx.stroke();
  }

  function drawFlatline(){
    const rect = screenEl.getBoundingClientRect();
    const w = rect.width, h = rect.height;
    ctx.clearRect(0,0,w,h);
    ctx.fillStyle = state.bgColor;
    ctx.fillRect(0,0,w,h);
    drawGrid(w,h);
    ctx.beginPath();
    ctx.moveTo(0, h/2);
    ctx.lineTo(w, h/2);
    ctx.strokeStyle = state.waveColor;
    ctx.globalAlpha = 0.35;
    ctx.lineWidth = state.lineWidth;
    ctx.stroke();
    ctx.globalAlpha = 1;
  }
  drawFlatline();

  let audioCtx, analyser, source, dataArray, rafId, stream;

  async function startListening(){
    try{
      statusText.textContent = 'Solicitando acceso…';
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 2048;
      analyser.smoothingTimeConstant = 0.85;
      source = audioCtx.createMediaStreamSource(stream);
      source.connect(analyser);
      dataArray = new Uint8Array(analyser.fftSize);

      state.listening = true;
      micBtn.classList.add('active');
      led.classList.remove('error');
      led.classList.add('live');
      statusText.textContent = 'Escuchando';
      idleOverlay.classList.add('hidden');

      loop();
    }catch(err){
      state.listening = false;
      led.classList.remove('live');
      led.classList.add('error');
      statusText.textContent = 'Sin acceso';
      idleText.textContent = 'No se pudo acceder al micrófono. Revisa los permisos del navegador e inténtalo de nuevo.';
      idleOverlay.classList.remove('hidden');
    }
  }

  function stopListening(){
    state.listening = false;
    if(rafId) cancelAnimationFrame(rafId);
    if(source) source.disconnect();
    if(audioCtx) audioCtx.close();
    if(stream) stream.getTracks().forEach(t => t.stop());
    micBtn.classList.remove('active');
    led.classList.remove('live','error');
    statusText.textContent = 'Inactivo';
    idleText.textContent = 'Activa el micrófono para ver tu voz convertida en onda, en tiempo real.';
    idleOverlay.classList.remove('hidden');
    drawFlatline();
  }

  function loop(){
    rafId = requestAnimationFrame(loop);
    if(!analyser) return;
    analyser.getByteTimeDomainData(dataArray);

    const rect = screenEl.getBoundingClientRect();
    const w = rect.width, h = rect.height;

    ctx.clearRect(0,0,w,h);
    ctx.fillStyle = state.bgColor;
    ctx.fillRect(0,0,w,h);
    drawGrid(w,h);

    ctx.lineWidth = state.lineWidth;
    ctx.strokeStyle = state.waveColor;
    ctx.shadowColor = state.waveColor;
    ctx.shadowBlur = state.glow;
    ctx.beginPath();

    const sliceWidth = w / dataArray.length;
    let x = 0;
    for(let i=0;i<dataArray.length;i++){
      const v = dataArray[i] / 128.0;
      const y = (v * h) / 2;
      if(i === 0) ctx.moveTo(x,y);
      else ctx.lineTo(x,y);
      x += sliceWidth;
    }
    ctx.stroke();
    ctx.shadowBlur = 0;
  }

  micBtn.addEventListener('click', () => {
    if(state.listening){
      stopListening();
    }else{
      startListening();
    }
  });
})();
</script>

</body>
</html>
